[platformio]
src_dir = .

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial speeds
upload_speed  = 230400
monitor_speed = 115200

; Board build settings — match Arduino IDE "ESP32 Dev Module" defaults
board_build.f_cpu      = 240000000L   ; 240 MHz
board_build.flash_size = 4MB
board_build.filesystem = littlefs     ; use LittleFS (not SPIFFS)

; Scan all library includes transitively (needed for Adafruit chain deps)
lib_ldf_mode = deep+

; Libraries downloaded automatically from the PlatformIO registry.
; SCServo is in lib/SCServo/ (project-local, not downloaded).
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1
    wollewald/INA219_WE @ ^1.4.1
